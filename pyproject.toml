[project]
name = "make-agents"
version = "0.1.0"
description = "채용공고 적재/질의 에이전트 (LangGraph + Neon + 커스텀 MCP)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.20",
    "langgraph>=0.2",
    "langchain-mcp-adapters",
    "mcp",
    "asyncpg",
    "python-dotenv",
    "langchain-google-genai>=4.4.1",
    "langchain-openai>=1.7.0",
    "langchain-tavily>=0.2.18",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: 실제 Neon DB·LLM·Tavily를 호출하는 테스트 (--run-integration 일 때만 실행)",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["frontend"]   # 프론트엔드(node_modules 등)는 검사하지 않는다

[tool.ruff.lint]
select = ["N"]   # pep8-naming: 변수·함수는 snake_case, 클래스는 CapWords, 상수는 UPPER_CASE

[tool.ruff.lint.per-file-ignores]
# 테스트 이름은 한글 문장으로 쓴다. ruff는 한글을 "소문자"로 보지 않아 N802가 모든 한글 이름에 걸린다.
"backend/tests/**" = ["N802"]
