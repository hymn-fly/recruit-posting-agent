[project]
name = "make-agents"
version = "0.1.0"
description = "채용공고 적재/질의 에이전트 (LangGraph + Neon + 커스텀 MCP)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.20",
    "langgraph>=0.2",
    "langchain-mcp-adapters",
    "mcp",
    "asyncpg",
    "python-dotenv",
    "langchain-google-genai>=4.4.1",
    "langchain-openai>=1.7.0",
    "langchain-tavily>=0.2.18",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pylint>=4.1.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: 실제 Neon DB·LLM·Tavily를 호출하는 테스트 (--run-integration 일 때만 실행)",
]

[tool.pylint.main]
# 이름 규칙(invalid-name)만 검사한다. 다른 pylint 규칙은 쓰지 않는다.
disable = ["all"]
enable = ["invalid-name"]
ignore-paths = ["^frontend/", "^\\.venv/", "^backend/tests/"]   # 테스트는 아직 검사하지 않는다

[tool.pylint.basic]
# 변수·인자는 소문자 snake_case 3글자 이상. 한글은 허용한다. 컴프리헨션 변수는 짧아도 된다.
variable-rgx = "[^\\W\\dA-Z][^\\WA-Z]{2,}$"
argument-rgx = "[^\\W\\dA-Z][^\\WA-Z]{2,}$"
# 모듈 레벨 이름: 상수는 UPPER_CASE, 한 번 만들어 재사용하는 모듈 전용 변수(_pool 등)는 밑줄로 시작하는 소문자
const-rgx = "([A-Z_][A-Z0-9_]*|__.*__|_[^\\W\\dA-Z][^\\WA-Z]{2,})$"
good-names = ["_", "id"]   # id: MCP 도구 파라미터 이름이라 바꿀 수 없다

