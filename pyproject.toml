[project]
name = "make-agents"
version = "0.1.0"
description = "채용공고 적재/질의 에이전트 (LangGraph + Neon + 커스텀 MCP)"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-mcp-adapters",
    "mcp",
    "asyncpg",
    "python-dotenv",
    "langchain-google-genai>=4.4.1",
    "langchain-openai>=1.7.0",
    "langchain-tavily>=0.2.18",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: 실제 Neon DB·LLM·Tavily를 호출하는 테스트 (--run-integration 일 때만 실행)",
]
